name: Deploy Candy Baked to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - bakery-products.json
      - chocolate-products.json
      - chocolate-formulas.json
      - assets/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html bakery-products.json chocolate-products.json chocolate-formulas.json dist/
          cp -R assets/. dist/assets/
          touch dist/.nojekyll

      - name: Normalize Cloudflare API token
        shell: bash
        env:
          SECRET_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$SECRET_API_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#\"}"
          TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"
          TOKEN="${TOKEN%\'}"
          EXTRACTED="$(printf '%s' "$TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | tail -n 1 || true)"
          if [ -n "$EXTRACTED" ]; then
            TOKEN="$EXTRACTED"
          fi
          if [ -z "$TOKEN" ]; then
            echo "credential_check=api_token_not_found"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "NORMALIZED_CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "credential_check=api_token_ready"

      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.NORMALIZED_CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=ogenic-chocolate --branch=main --commit-dirty=true

name: Deploy Candy Baked to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - wf-sequence-preview.html
      - wf-sequence.manifest.json
      - bakery-products.json
      - chocolate-products.json
      - chocolate-formulas.json
      - posters.json
      - assets/**
      - scripts/build-cloudflare-backup.mjs
      - scripts/validate-wf-sequence.mjs
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Validate A1-A6 and deploy to Cloudflare Pages
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate canonical WF Sequence A1-A6
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-wf-sequence.mjs

      - name: Prepare static site + Cloudflare image backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html wf-sequence-preview.html wf-sequence.manifest.json chocolate-formulas.json dist/
          cp -R assets/. dist/assets/
          node scripts/build-cloudflare-backup.mjs
          touch dist/.nojekyll

      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN00000000000000 }}
          wranglerVersion: "4.127.1"
          command: pages project create ogenic-chocolate --production-branch=main

      - name: Deploy production to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN00000000000000 }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.127.1"
          command: pages deploy dist --project-name=ogenic-chocolate --branch=main --commit-dirty=true

name: Deploy Candy Baked to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - bakery-products.json
      - chocolate-products.json
      - chocolate-formulas.json
      - assets/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html bakery-products.json chocolate-products.json chocolate-formulas.json dist/
          cp -R assets/. dist/assets/
          touch dist/.nojekyll

      - name: Resolve Cloudflare API token
        shell: bash
        env:
          TOKEN_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_CLOUDFLARE: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_CF: ${{ secrets.CF_API_TOKEN }}
          TOKEN_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=""
          for RAW in "$TOKEN_API" "$TOKEN_CLOUDFLARE" "$TOKEN_CF" "$TOKEN_KEY" "$TOKEN_SECRET"
          do
            [ -n "$RAW" ] || continue
            VALUE="$(printf '%s' "$RAW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            VALUE="${VALUE#CLOUDFLARE_API_TOKEN=}"
            VALUE="${VALUE#CLOUDFLARE_TOKEN=}"
            VALUE="${VALUE#CF_API_TOKEN=}"
            VALUE="${VALUE#Bearer }"
            VALUE="${VALUE#bearer }"
            EXTRACTED="$(printf '%s' "$VALUE" | grep -oE '[A-Za-z0-9_-]{30,}' | tail -n 1 || true)"
            if [ -n "$EXTRACTED" ]; then
              VALUE="$EXTRACTED"
            fi
            if [ -n "$VALUE" ]; then
              TOKEN="$VALUE"
              break
            fi
          done
          if [ -z "$TOKEN" ]; then
            echo "credential_check=no_actions_token_found"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "NORMALIZED_CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "credential_check=actions_token_ready"

      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.NORMALIZED_CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=ogenic-chocolate --branch=main --commit-dirty=true

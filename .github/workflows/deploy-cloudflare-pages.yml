name: Deploy Candy Baked to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - bakery-products.json
      - chocolate-products.json
      - chocolate-formulas.json
      - assets/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html bakery-products.json chocolate-products.json chocolate-formulas.json dist/
          cp -R assets/. dist/assets/
          touch dist/.nojekyll

      - name: Resolve Cloudflare API token
        shell: bash
        env:
          ALL_REPOSITORY_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$ALL_REPOSITORY_SECRETS" | jq -r '
            to_entries
            | map(select(.key | test("^(CLOUDFLARE_TO|CLOUDFLARE_API_TO|CF_API_TO)")))
            | map(select(.value != ""))
            | .[0].value // empty
          ')"
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"
          TOKEN="${TOKEN#CLOUDFLARE_TOKEN=}"
          TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          EXTRACTED="$(printf '%s' "$TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | tail -n 1 || true)"
          if [ -n "$EXTRACTED" ]; then
            TOKEN="$EXTRACTED"
          fi
          if [ -z "$TOKEN" ]; then
            echo "credential_check=no_cloudflare_token_secret_found"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "NORMALIZED_CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "credential_check=cloudflare_token_ready"

      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.NORMALIZED_CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=ogenic-chocolate --branch=main --commit-dirty=true

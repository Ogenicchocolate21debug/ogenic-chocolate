name: Deploy Candy Baked to Cloudflare Pages

on:
  push:
    branches:
      - main
      - wf-sequence-a1-a6-v2
    paths:
      - index.html
      - wf-sequence-preview.html
      - wf-sequence.manifest.json
      - chocolate-products.json
      - chocolate-formulas.json
      - assets/**
      - scripts/validate-wf-sequence.mjs
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy A1-A6 to Cloudflare Pages
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate canonical A1-A6 on production only
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-wf-sequence.mjs

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html wf-sequence-preview.html wf-sequence.manifest.json dist/
          [ -f chocolate-products.json ] && cp chocolate-products.json dist/ || true
          [ -f chocolate-formulas.json ] && cp chocolate-formulas.json dist/ || true
          cp -R assets/. dist/assets/
          touch dist/.nojekyll

      - name: Ensure Cloudflare Pages project exists
        if: github.ref_name == 'main'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN00000000000000 }}
          wranglerVersion: "4.127.1"
          command: pages project create ogenic-chocolate --production-branch=main

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN00000000000000 }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.127.1"
          command: pages deploy dist --project-name=ogenic-chocolate --branch=${{ github.ref_name }} --commit-dirty=true

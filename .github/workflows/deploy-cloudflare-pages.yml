name: Deploy Candy Baked to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - bakery-products.json
      - chocolate-products.json
      - chocolate-formulas.json
      - assets/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html bakery-products.json chocolate-products.json chocolate-formulas.json dist/
          cp -R assets/. dist/assets/
          touch dist/.nojekyll

      - name: Deploy production to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.127.1"
          command: pages deploy dist --project-name=ogenic-chocolate --branch=main --commit-dirty=true

name: Deploy Candy Baked to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - bakery-products.json
      - chocolate-products.json
      - chocolate-formulas.json
      - assets/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html bakery-products.json chocolate-products.json chocolate-formulas.json dist/
          # Preserve the repository asset tree exactly as referenced by the site.
          cp -R assets/. dist/assets/
          touch dist/.nojekyll

      - name: Normalize Cloudflare credentials
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#\"}"
          TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"
          TOKEN="${TOKEN%\'}"

          ACCOUNT_ID="${ACCOUNT_ID#CLOUDFLARE_ACCOUNT_ID=}"
          ACCOUNT_ID="${ACCOUNT_ID#\"}"
          ACCOUNT_ID="${ACCOUNT_ID%\"}"
          ACCOUNT_ID="${ACCOUNT_ID#\'}"
          ACCOUNT_ID="${ACCOUNT_ID%\'}"

          test -n "$TOKEN"
          [[ "$ACCOUNT_ID" =~ ^[0-9A-Fa-f]{32}$ ]]

          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT_ID"
          {
            echo "NORMALIZED_CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "NORMALIZED_CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID"
          } >> "$GITHUB_ENV"

      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.NORMALIZED_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.NORMALIZED_CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=ogenic-chocolate --branch=main --commit-dirty=true

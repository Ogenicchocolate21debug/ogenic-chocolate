name: Cloudflare Preview Recheck

on:
  push:
    branches: [cf-recheck-20260905]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-preview-recheck
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy preview to Cloudflare Pages
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Prepare static site + current backup inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html chocolate-formulas.json dist/
          cp -R assets/. dist/assets/
          node scripts/build-cloudflare-backup.mjs
          touch dist/.nojekyll

      - name: Deploy branch preview to Cloudflare Pages
        id: cloudflare-preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN00000000000000 }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.127.1"
          command: pages deploy dist --project-name=ogenic-chocolate --branch=cf-recheck-20260905 --commit-dirty=true

name: Deploy image-fix preview

on:
  push:
    branches:
      - preview/image-fix-v0dc5ba1f
    paths:
      - "preview-site/**"
      - ".github/workflows/preview-image-fix-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-image-fix-preview"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
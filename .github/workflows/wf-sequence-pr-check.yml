name: Validate WF Sequence A1-A6

on:
  pull_request:
    paths:
      - index.html
      - wf-sequence.manifest.json
      - scripts/generate-wf-sequence.mjs
      - scripts/validate-wf-sequence.mjs
      - assets/**
      - .github/workflows/deploy-cloudflare-pages.yml
      - .github/workflows/wf-sequence-pr-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate canonical A1-A6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run deterministic WF validator
        shell: bash
        run: |
          node scripts/generate-wf-sequence.mjs
          git diff --exit-code -- wf-sequence.manifest.json
          node scripts/validate-wf-sequence.mjs

name: Deploy Candy Baked Preview

on:
  push:
    branches:
      - "wf-a1-a6-*"
    paths:
      - index.html
      - wf-sequence.manifest.json
      - assets/**
      - scripts/generate-wf-sequence.mjs
      - scripts/validate-wf-sequence.mjs
      - .github/workflows/deploy-cloudflare-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Validate and deploy branch preview
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate and prepare static site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-wf-sequence.mjs
          git diff --exit-code -- wf-sequence.manifest.json
          node scripts/validate-wf-sequence.mjs
          mkdir -p dist/assets
          cp index.html wf-sequence.manifest.json dist/
          cp -R assets/. dist/assets/
          touch dist/.nojekyll

      - name: Deploy isolated Cloudflare preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN00000000000000 }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.127.1"
          command: pages deploy dist --project-name=ogenic-chocolate --branch=${{ github.ref_name }} --commit-dirty=true

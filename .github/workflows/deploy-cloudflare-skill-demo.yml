name: Deploy GOD MODE A1-A5 Skill Demo Preview

on:
  push:
    branches:
      - skill-demo-a1-a5-20260904
    paths:
      - skill-demo-site/**
      - .github/workflows/deploy-cloudflare-skill-demo.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-skill-demo-a1-a5
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Build and deploy isolated preview
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Prepare preview dist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -R skill-demo-site/. dist/
          test -f dist/index.html
          test -f dist/source-manifest.json
          python -m json.tool dist/source-manifest.json >/dev/null
          touch dist/.nojekyll

      - name: Deploy Cloudflare Pages preview
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN00000000000000 }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.127.1"
          command: pages deploy dist --project-name=ogenic-chocolate --branch=skill-demo-a1-a5-20260904 --commit-dirty=true
